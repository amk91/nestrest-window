<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestRest Window</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <h1>NestRest Camera Monitor</h1>
    </header>

    <!-- Load compiled JavaScript modules -->
    <script type="module">
        // Import the main entry point (Vite will handle dependencies)
        import './src/index.ts';
    </script>

    <div id="device-grid" class="mui-container">
        <!-- Device cards will be inserted here dynamically -->
    </div>

    <template id="device-card-template">
        <div class="device-card mui-card" device-ip="">
            <div class="device-header">
                <span class="device-name"></span>
                <span class="device-status"></span>
                <span class="device-fps">FPS: <span class="device-fps-value"></span></span>
            </div>
            <div class="device-video">
            </div>
            <div class="device-footer">
                <div class="command-buttons">
                    <div class="tooltip-wrapper">
                        <button class="mui-circular-btn btn-restart"></button>
                        <span class="custom-tooltip">Restart Device</span>
                    </div>
                    <div class="tooltip-wrapper">
                        <button class="mui-circular-btn btn-stop-stream"></button>
                        <span class="custom-tooltip">Stop Stream</span>
                    </div>
                    <div class="tooltip-wrapper">
                        <button class="mui-circular-btn btn-start-stream"></button>
                        <span class="custom-tooltip">Start Stream</span>
                    </div>
                    <div class="tooltip-wrapper">
                        <button class="mui-circular-btn btn-motion-stream"></button>
                        <span class="custom-tooltip">Stream on Motion</span>
                    </div>
                    <div class="tooltip-wrapper">
                        <button class="mui-circular-btn btn-turn-led-on"></button>
                        <span class="custom-tooltip">Led On</span>
                    </div>
                    <div class="tooltip-wrapper">
                        <button class="mui-circular-btn btn-turn-led-off"></button>
                        <span class="custom-tooltip">Led Off</span>
                    </div>
                </div>
            </div>
        </div>
    </template>
</body>

</html>
